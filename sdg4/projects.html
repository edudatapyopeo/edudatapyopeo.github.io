<html lang="th">
<head>

  <link rel="icon" href="../assets/images/moe-icon.png"><link rel="stylesheet" href="../assets/css/tailwind.css"><link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-dashboard="sdg4-projects" class="min-h-screen bg-slate-50 font-sans text-slate-800">
  <a href="#mainContent" class="skip-link">ข้ามไปยังเนื้อหา</a>
  <header class="border-b bg-white shadow-sm"><div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6"><div class="flex items-center gap-3"><img src="../assets/images/moe-icon.png" alt="ตรากระทรวงศึกษาธิการ" class="h-12 w-12 object-contain"><div><h1 class="text-lg font-bold text-slate-900">รายงานการดำเนินโครงการในจังหวัด</h1><p class="text-xs text-slate-500">ระบบ SDG4 จังหวัดพะเยา</p></div></div><a href="index.html" class="focus-ring rounded-lg bg-emerald-50 px-3 py-2 text-sm font-semibold text-emerald-700">ภาพรวมระบบ SDG4</a></div></header>
  <main id="mainContent" class="mx-auto max-w-7xl px-4 py-8 sm:px-6">
    <section class="rounded-3xl bg-gradient-to-r from-slate-950 via-emerald-950 to-emerald-700 p-6 text-white shadow-soft sm:p-8"><p class="text-xs font-bold tracking-[.24em] text-emerald-100">SDG4 PROJECT REPORTING</p><h2 class="mt-2 text-2xl font-bold sm:text-3xl">ผลการดำเนินโครงการที่เกี่ยวข้องกับ SDG4</h2></section>
    <div id="sdg4Notice" class="mt-5 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm leading-6 text-amber-900" role="status" hidden></div>
    <section id="projectSection" class="mt-7" aria-labelledby="projectHeading">
      <div class="flex flex-col gap-4 md:flex-row md:items-end md:justify-between"><h2 id="projectHeading" class="text-2xl font-bold text-slate-900">โครงการในจังหวัด</h2><div class="grid gap-3 sm:grid-cols-3"><label class="text-sm font-semibold text-slate-700">ปีโครงการ<select id="projectYearFilter" class="focus-ring mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-normal"><option value="">ทุกปี</option></select></label><label class="text-sm font-semibold text-slate-700">เป้าหมาย SDG4<select id="projectTargetFilter" class="focus-ring mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-normal"><option value="">ทุกเป้าหมาย</option></select></label><label class="text-sm font-semibold text-slate-700">ประเภทโครงการ<select id="projectTypeFilter" class="focus-ring mt-1.5 w-full rounded-xl border border-slate-300 bg-white px-3 py-2.5 font-normal"><option value="">ทุกประเภท</option></select></label></div></div>
      <p id="projectSummary" class="mt-4 text-sm text-slate-600"></p><div id="projectCardGrid" class="mt-5 grid items-start gap-6 md:grid-cols-2 xl:grid-cols-3"></div>
    </section>
  </main>
  <script src="../assets/js/dashboard-shell.js" defer></script><script src="../assets/js/site.js" defer></script><script src="../assets/js/config.js" defer></script><script src="../assets/js/data-client.js" defer></script><script src="../assets/js/sdg4-dashboard.js" defer></script>
